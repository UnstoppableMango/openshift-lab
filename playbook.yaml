- name: Test
  hosts: localhost
  become: true
  vars:
    gitlab_url: https://gitlab.fhlbdm.com
    registration_token: TODO
    runner_user: dsvc_gitrunner
    runner_group: g-ad-group-default_svc-acct_group
    runner_name: cluster-configuration-dev
    runner_config_file: /etc/gitlab-runner/config.toml
    runner_work_dir: /home/gitlab-runner
    systemd_dropin_dir: /etc/systemd/system/gitlab-runner.service.d/
    kerberos_realm: EXAMPLE.COM
    kerberos_kdc: kdc.example.com
    kerberos_admin_server: kdc.example.com
    subuid_range: "2147483647:2147483648"
    subgid_range: "2147483647:2147483648"
    oc_version: "4.20.0"
    helm_version: "v3.17.3"
  tasks:
    # Step 1: Install tooling
    - name: Install podman
      dnf:
        name: podman
        state: present

    - name: Install krb5-workstation
      dnf:
        name: krb5-workstation
        state: present

    - name: Add Microsoft SQL Server tools repo
      yum_repository:
        name: mssql-tools
        description: Microsoft SQL Server Tools
        baseurl: https://packages.microsoft.com/rhel/9/prod/
        gpgcheck: true
        gpgkey: https://packages.microsoft.com/keys/microsoft.asc
        enabled: true

    - name: Accept mssql-tools18 EULA
      shell: ACCEPT_EULA=Y dnf install -y mssql-tools18 unixODBC-devel
      args:
        creates: /opt/mssql-tools18/bin/sqlcmd

    - name: Download oc CLI tarball
      get_url:
        url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ oc_version }}/openshift-client-linux-amd64-rhel9.tar.gz"
        dest: /tmp/oc.tar.gz

    - name: Extract oc CLI to /usr/local/bin
      unarchive:
        src: /tmp/oc.tar.gz
        dest: /usr/local/bin/
        remote_src: true
        include:
          - oc

    - name: Download helm tarball
      get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: /tmp/helm.tar.gz

    - name: Extract helm binary
      unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp/
        remote_src: true

    - name: Install helm to /usr/local/bin
      copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        mode: "0755"
        remote_src: true

    # Step 2: Configure UID/GID mapping
    - name: Configure subuid for runner user
      lineinfile:
        path: /etc/subuid
        line: "{{ runner_user }}:{{ subuid_range }}"
        regexp: "^{{ runner_user }}:"
        create: true

    - name: Configure subgid for runner user
      lineinfile:
        path: /etc/subgid
        line: "{{ runner_user }}:{{ subgid_range }}"
        regexp: "^{{ runner_user }}:"
        create: true

    # Step 3: Configure Kerberos
    - name: Create Kerberos realm configuration
      copy:
        owner: root
        group: root
        mode: "a+r"
        dest: "/etc/krb5.conf.d/{{ kerberos_realm | lower }}_realm"
        content: |
          [libdefaults]
            default_realm = {{ kerberos_realm }}

          [realms]
            {{ kerberos_realm }} = {
              kdc = {{ kerberos_kdc }}
              admin_server = {{ kerberos_admin_server }}
            }

          [domain_realm]
            .{{ kerberos_kdc.split('.')[1:] | join('.') }} = {{ kerberos_realm }}
            {{ kerberos_kdc.split('.')[1:] | join('.') }} = {{ kerberos_realm }}

    # Step 5: Configure the GitLab runner
    - name: Create runner work directory
      file:
        path: "{{ runner_work_dir }}"
        state: directory
        owner: "{{ runner_user }}"
        group: "{{ runner_group }}"
        mode: "0750"

    - name: Add GitLab YUM repo
      yum_repository:
        # https://packages.gitlab.com/install/repostiories/runner/gitlab-runner/fedora/43/config_file.repo
        name: gitlab-runner
        description: GitLab runner repository
        baseurl: https://packages.gitlab.com/runner/gitlab-runner/fedora/43/$basearch
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey:
          - https://packages.gitlab.com/gpgkey/gpg.key
          - https://packages.gitlab.com/gpgkey/runner/49F16C5CC3A0F81F.pub.gpg
          - https://packages.gitlab.com/gpgkey/runner/4C80FB51394521E9.pub.gpg
        sslverify: true
        sslcacert: /etc/pki/tls/certs/ca-bundle.crt
        metadata_expire: 300

    - name: Install gitlab-runner
      dnf:
        name: gitlab-runner >= 18.10
        update_cache: true

    - name: Create systemd drop-ins dir
      file:
        name: "{{ systemd_dropin_dir }}"
        state: directory

    - name: Copy systemd drop-in
      copy:
        owner: root
        group: root
        dest: "{{ systemd_dropin_dir }}/{{ runner_user }}.conf"
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/gitlab-runner "run" "--config" "{{ runner_config_file }}" "--working-directory" "{{ runner_work_dir }}" "--service" "gitlab-runner" "--user" "{{ runner_user }}"
          EnvironmentFile=

    - name: Copy runner configuration
      copy:
        owner: root
        group: root
        dest: "{{ runner_config_file }}"
        content: |
          concurrent = 1
          check_interval = 0
          shutdown_timeout = 0

          [session_server]
            session_timeout = 1800

          [[runners]]
            name = "{{ runner_name }}"
            url = "{{ gitlab_url }}"
            token = "{{ registration_token }}"
            executor = "shell"
            [runners.cache]
              MaxUploadedArchiveSize = 0

    - name: Reload systemd daemon
      systemd:
        daemon_reload: true

    - name: Enable and start gitlab-runner service
      systemd:
        name: gitlab-runner
        enabled: true
        state: started
